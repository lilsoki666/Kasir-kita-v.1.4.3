name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev python3-pip python3-setuptools libzip-dev unzip zlib1g-dev \
          openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev \
          libavcodec-dev autoconf libtool pkg-config

    - name: Setup Android SDK & Force AIDL
      run: |
        # Set variabel lingkungan Android SDK
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        
        # Install Android Build-tools versi 30.0.3 & Platform API 33
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-33" "platform-tools"
        
        # Cari lokasi pasti file binary aidl
        AIDL_PATH=$(find $ANDROID_HOME -name "aidl" -type f | head -n 1)
        echo "LOKASI AIDL: $AIDL_PATH"
        
        # Salin dan buat Symlink AIDL secara paksa ke sistem PATH global
        if [ -f "$AIDL_PATH" ]; then
          sudo cp "$AIDL_PATH" /usr/bin/aidl
          sudo cp "$AIDL_PATH" /usr/local/bin/aidl
          sudo chmod +x /usr/bin/aidl
          sudo chmod +x /usr/local/bin/aidl
          echo "BERHASIL: AIDL disalin ke /usr/bin/aidl"
        else
          echo "GAGAL: AIDL tidak ditemukan!"
          exit 1
        fi
        
        # Tes keberadaan aidl di terminal
        which aidl
        aidl --version || true

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Build APK with Buildozer
      run: |
        rm -rf .buildozer/android/platform/build-*
        
        # Jalankan buildozer dengan PATH terdaftar
        export PATH=$PATH:$ANDROID_HOME/build-tools/30.0.3
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kasir-kita-apk
        path: bin/*.apk
