name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev python3-pip python3-setuptools libzip-dev unzip zlib1g-dev \
          openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev \
          libavcodec-dev autoconf libtool pkg-config

    - name: Accept Android SDK Licenses & Install Build-Tools
      run: |
        # Setujui semua lisensi SDK secara otomatis
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install build-tools versi 30.0.3 & platform 33
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-33" "platform-tools"
        
        # Buat symlink aidl ke sistem PATH global
        AIDL_BIN=$(find $ANDROID_HOME -name "aidl" -type f | head -n 1)
        sudo cp "$AIDL_BIN" /usr/bin/aidl
        sudo chmod +x /usr/bin/aidl

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Build APK with Buildozer
      env:
        # Arahkan Buildozer menggunakan Android SDK bawaan runner (mencegah Buildozer download ulang)
        ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        rm -rf .buildozer/android/platform/build-*
        
        # Ekspor environment variable agar p4a membaca SDK & NDK lokal
        export ANDROIDSDK=$ANDROID_HOME
        export ANDROIDNDK=$ANDROID_HOME/ndk/25.2.9519653
        
        buildozer -v android debug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kasir-kita-apk
        path: bin/*.apk
