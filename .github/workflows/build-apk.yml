name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev \
          python3-dev python3-pip python3-setuptools libzip-dev unzip zlib1g-dev \
          openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixin-dev \
          libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev \
          libavcodec-dev autoconf libtool pkg-config

    - name: Install Android Build-Tools & Fix AIDL
      run: |
        # Install build-tools 30.0.3 yang dijamin memiliki aidl
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;30.0.3" "platforms;android-33"
        
        # Buat symlink global untuk aidl agar selalu terdeteksi oleh p4a
        AIDL_BIN=$(find $ANDROID_HOME/build-tools -name "aidl" | tail -n 1)
        sudo ln -sf $AIDL_BIN /usr/bin/aidl
        sudo ln -sf $AIDL_BIN /usr/local/bin/aidl

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer

    - name: Build APK with Buildozer
      run: |
        rm -rf .buildozer/android/platform/build-*
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kasir-kita-apk
        path: bin/*.apk
